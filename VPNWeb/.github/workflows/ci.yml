name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Check environment and run isolated tests
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
          python -m compileall -q app.py wsgi.py setup_local.py family_vpn
      - name: Check patch whitespace
        run: git show --format= --check HEAD
  container:
    name: ${{ matrix.flavour }} ${{ matrix.arch }} container
    needs: tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: standalone
            arch: amd64
            runner: ubuntu-24.04
            context: .
            smoke: Tools/smoke_container.sh
          - flavour: addon
            arch: amd64
            runner: ubuntu-24.04
            context: family_vpn
            smoke: Tools/smoke_addon.sh
          - flavour: addon
            arch: aarch64
            runner: ubuntu-24.04-arm
            context: family_vpn
            smoke: Tools/smoke_addon.sh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build runtime image
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          cmp requirements.lock family_vpn/requirements.lock
          docker build --pull --build-arg "BUILD_ARCH=$BUILD_ARCH" -t vpnweb:test "$BUILD_CONTEXT"
      - name: Check production entry point without APNs credentials
        env:
          SMOKE_SCRIPT: ${{ matrix.smoke }}
        run: bash "$SMOKE_SCRIPT" vpnweb:test
      - name: Exercise synthetic Supervisor gateway
        if: matrix.flavour == 'addon'
        run: bash Tools/smoke_ingress.sh vpnweb:test
