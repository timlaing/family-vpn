configuration:
  admin_bearer:
    name: Administrative REST bearer
    description: Optional separate random value with at least 32 characters. Leave blank to generate and persist on first startup. Never share it with enrolled devices.
  registration_bearer:
    name: Device enrollment bearer
    description: Optional separate random value with at least 32 characters. Leave blank to generate and persist on first startup; retrieve it in the dashboard for device enrollment.
network:
  8500/tcp: VPN-only bearer-authenticated REST port for Nginx Proxy Manager; no dashboard.
