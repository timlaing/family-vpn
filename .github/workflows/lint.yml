name: Repository and Home Assistant lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate action references
        run: python3 Tools/check_action_refs.py
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo /tmp/actionlint-checksums.txt "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cp /tmp/actionlint.tar.gz "/tmp/$archive"
          (cd /tmp && grep " $archive$" actionlint-checksums.txt | sha256sum -c -)
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Lint workflows
        run: /tmp/actionlint -color
  addon:
    name: Home Assistant app schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Home Assistant app lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: family_vpn
          community: false
