name: Check prek dependency sync
on:
  pull_request:
    paths: ['requirements*', 'family_vpn/requirements.lock', '.pre-commit-config.yaml', 'scripts/sync_prek_deps.py', 'scripts/check_runtime_locks.py', '.github/workflows/sync-prek-deps.yml']
  push:
    branches: [main]
    paths: ['requirements*', 'family_vpn/requirements.lock', '.pre-commit-config.yaml', 'scripts/sync_prek_deps.py', 'scripts/check_runtime_locks.py', '.github/workflows/sync-prek-deps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated hook dependencies and runtime locks
        run: |
          python3 scripts/sync_prek_deps.py --check requirements-test.txt
          python3 scripts/check_runtime_locks.py
