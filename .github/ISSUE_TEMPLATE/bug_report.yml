name: Bug report
description: Report a reproducible problem using sanitized data.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, APNs tokens, private reports or database files. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Native/app version or commit, iOS/iPadOS/macOS or Home Assistant version, architecture, VPN endpoint type, and source/container deployment.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized evidence
    validations:
      required: true
