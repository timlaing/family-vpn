services:
  vpn:
    build: .
    image: family-vpn-strongswan:local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
    env_file: runtime/gateway.env
    volumes:
      - ./runtime/swanctl:/etc/swanctl:ro
    tmpfs:
      - /run
    networks:
      vpn:
        ipv4_address: ${VPN_CONTAINER_ADDRESS:-10.88.0.2}
networks:
  vpn:
    driver: bridge
    ipam:
      config:
        - subnet: ${VPN_DOCKER_SUBNET:-10.88.0.0/24}
