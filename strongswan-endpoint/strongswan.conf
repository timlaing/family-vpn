charon {
    load_modular = yes
    install_routes = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
    filelog {
        stdout {
            path = /dev/stdout
            default = 1
            flush_line = yes
        }
    }
}
include strongswan.d/*.conf

# Private endpoint authentication configuration (optional for local accounts).
include /run/family-vpn-auth.conf
