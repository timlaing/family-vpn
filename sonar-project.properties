sonar.projectKey=timlaing_family-vpn
sonar.organization=timlaing
sonar.projectName=Family VPN
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,MyVPN/Tests/**,MyVPN/Tools/test_*.py,MyVPN/Watchdog/test_*.py
sonar.exclusions=tests/**,MyVPN/Tests/**,**/test_*.py,.private-docs/**,**/Resources/**,**/Assets.xcassets/**,**/.venv/**,**/__pycache__/**,.scannerwork/**,.coverage,coverage.xml,**/*.mobileconfig
sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
# Native XCTest coverage needs a converted Xcode coverage report; do not claim Python coverage for Swift.
sonar.coverage.exclusions=**/*.swift,**/*.js,Tools/**,MyVPN/Tools/**,MyVPN/Watchdog/**,app.py,wsgi.py,setup_local.py,family_vpn/wsgi.py

# Only clear-text transport findings in the isolated Docker ingress smoke fixture.
sonar.issue.ignore.multicriteria=ingressSmokeHttp,privilegedVpn,signedRelayCsrf,exampleVpnPool
sonar.issue.ignore.multicriteria.ingressSmokeHttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.ingressSmokeHttp.resourceKey=Tools/smoke_ingress.sh

# The gateway needs root to manage XFRM/firewall state and read private credentials.
# Its CA key is never mounted; the management image uses a separate non-root user.
sonar.issue.ignore.multicriteria.privilegedVpn.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.privilegedVpn.resourceKey=strongswan-endpoint/Dockerfile
# This cookie-free JSON API uses explicit bearer/HMAC headers, not ambient browser credentials.
# Forged, unsigned and replayed requests are rejected by the relay authentication tests.
sonar.issue.ignore.multicriteria.signedRelayCsrf.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.signedRelayCsrf.resourceKey=family_vpn/relay_service.py
# An overridable example VPN client pool, not a fixed remote host or production address.
sonar.issue.ignore.multicriteria.exampleVpnPool.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.exampleVpnPool.resourceKey=strongswan-endpoint/configure.py
