sonar.projectKey=timlaing_family-vpn
sonar.organization=timlaing
sonar.projectName=Family VPN
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,MyVPN/Tests/**,MyVPN/Tools/test_*.py,MyVPN/Watchdog/test_*.py
sonar.exclusions=tests/**,MyVPN/Tests/**,**/test_*.py,.private-docs/**,**/Resources/**,**/Assets.xcassets/**,**/.venv/**,**/__pycache__/**,.scannerwork/**,.coverage,coverage.xml,**/*.mobileconfig
sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
# Native XCTest coverage needs a converted Xcode coverage report; do not claim Python coverage for Swift.
sonar.coverage.exclusions=**/*.swift,**/*.js,Tools/**,MyVPN/Tools/**,MyVPN/Watchdog/**,app.py,wsgi.py,setup_local.py,family_vpn/wsgi.py
