minimum_pre_commit_version: '3.2.0'
default_language_version:
  python: python3
exclude: ^(\.private-docs/|.*Assets\.xcassets/|.*Resources/.*\.(cer|mobileconfig)$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-docstring-first
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
        stages: [manual]
  - repo: local
    hooks:
      - id: check-prek-deps
        name: Check prek dependency sync
        language: system
        entry: python3 scripts/sync_prek_deps.py --check requirements-test.txt
        files: ^(requirements.*|\.pre-commit-config\.yaml|scripts/sync_prek_deps\.py)$
        pass_filenames: false
      - id: check-runtime-locks
        name: Check standalone and add-on dependency locks
        language: system
        entry: python3 scripts/check_runtime_locks.py
        files: (^requirements\.lock$|^family_vpn/requirements\.lock$)
        pass_filenames: false
      - id: check-action-refs
        name: Check workflow action references
        language: system
        entry: python3 Tools/check_action_refs.py
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: pytest
        name: Isolated Python tests
        entry: python -m pytest -q
        language: python
        stages: [manual]
        pass_filenames: false
        additional_dependencies:
          # BEGIN GENERATED REQUIREMENTS
          - anyio==4.15.1
          - blinker==1.9.0
          - certifi==2026.7.22
          - cffi==2.1.1
          - click==8.5.0
          - cryptography==50.0.2
          - Flask==3.1.3
          - gunicorn==26.2.0
          - h11==0.16.0
          - h2==4.4.1
          - hpack==4.2.0
          - httpcore==1.0.9
          - httpx==0.28.1
          - hyperframe==6.1.0
          - idna==3.20
          - itsdangerous==2.2.0
          - Jinja2==3.1.6
          - MarkupSafe==3.0.4
          - packaging==26.3
          - pycparser==3.1
          - typing_extensions==4.16.0
          - Werkzeug==3.1.9
          - Flask-WTF==1.3.0
          - WTForms==3.2.2
          - qrcode==8.2
          - iniconfig==2.3.1
          - pluggy==1.6.0
          - Pygments==2.21.0
          - pytest==9.1.1
          # END GENERATED REQUIREMENTS
